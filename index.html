<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLARA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 4vw, 32px);
      background: #050505;
      position: relative;
      overflow: hidden;
    }

    /* fundo mais moderno */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .bg span {
      position: absolute;
      width: 40vmax;
      height: 40vmax;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.22;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .bg span:nth-child(1) {
      top: -10vmax;
      left: -10vmax;
      background: #7b61ff;
    }

    .bg span:nth-child(2) {
      bottom: -14vmax;
      right: -8vmax;
      background: #ff2d55;
      animation-delay: 4s;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(24px, -28px) scale(1.08);
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 980px);
      padding: clamp(28px, 5vw, 64px);
      border-radius: 36px;
      background: rgba(12, 12, 14, 0.86);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    h1 {
      font-family: 'Anton', sans-serif;
      font-size: clamp(3.6rem, 14vw, 8rem);
      line-height: 0.9;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow:
        0 0 18px rgba(255,255,255,0.12),
        0 0 42px rgba(123,97,255,0.22);
      margin-bottom: clamp(18px, 4vw, 28px);
      word-break: break-word;
    }

    .divider {
      width: min(120px, 28vw);
      height: 4px;
      margin: 0 auto clamp(22px, 5vw, 34px);
      border-radius: 999px;
      background: linear-gradient(90deg, #7b61ff, #ff2d55);
      box-shadow: 0 0 18px rgba(123,97,255,0.35);
    }

    .message {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 0.95;
      letter-spacing: 0.04em;
      margin-bottom: clamp(28px, 5vw, 40px);
    }

    .message .small {
      font-size: clamp(1rem, 2.8vw, 1.5rem);
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.22em;
    }

    .message .big {
      font-size: clamp(2.2rem, 9vw, 5.6rem);
      background: linear-gradient(180deg, #ffffff 0%, #ffd6e5 38%, #ff2d55 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0 0 22px rgba(255,45,85,0.28),
        0 0 46px rgba(255,45,85,0.16);
      word-break: break-word;
    }

    .message .underline {
      width: min(180px, 42vw);
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff2d55, #ff6b8f);
      box-shadow: 0 0 20px rgba(255,45,85,0.45);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      flex: 1 1 220px;
      max-width: 300px;
      border: none;
      border-radius: 18px;
      padding: 15px 20px;
      font-size: clamp(0.95rem, 2.6vw, 1rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      min-height: 54px;
    }

    .primary {
      background: linear-gradient(135deg, #7b61ff, #ff2d55);
      color: #fff;
      box-shadow: 0 14px 30px rgba(123,97,255,0.28);
    }

    .primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 20px 40px rgba(123,97,255,0.36);
    }

    .secondary {
      background: rgba(255,255,255,0.06);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .secondary:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.1);
    }

    @media (max-width: 560px) {
      body {
        align-items: flex-start;
      }

      .card {
        border-radius: 28px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span></span>
    <span></span>
  </div>

  <main class="card">
    <h1>CLARA</h1>
    <div class="divider"></div>

    <div class="message">
      <span class="small">simplesmente</span>
      <span class="big">vai se fuder</span>
      <span class="underline"></span>
    </div>

    <div class="actions">
      <button class="primary" id="flashBtn">✨ ACENDER</button>
      <button class="secondary" id="glitchBtn">⚡ GLITCH</button>
    </div>
  </main>

  <script>
    const card = document.querySelector('.card');
    const title = document.querySelector('h1');

    document.getElementById('flashBtn').addEventListener('click', () => {
      card.animate(
        [
          { transform: 'scale(1)', boxShadow: '0 24px 70px rgba(0,0,0,.55)' },
          { transform: 'scale(1.03)', boxShadow: '0 28px 90px rgba(255,45,85,.35)' },
          { transform: 'scale(1)' }
        ],
        { duration: 650, easing: 'ease-in-out' }
      );
    });

    document.getElementById('glitchBtn').addEventListener('click', () => {
      title.animate(
        [
          { transform: 'translate(0,0)' },
          { transform: 'translate(-3px,2px)' },
          { transform: 'translate(3px,-2px)' },
          { transform: 'translate(-2px,-1px)' },
          { transform: 'translate(0,0)' }
        ],
        { duration: 260, iterations: 3 }
      );
    });
  </script>
</body>
</html>
