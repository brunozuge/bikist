<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Bianca 💚</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  background:linear-gradient(-45deg,#a8edea,#d0f7f3,#ffffff,#bffcf6);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
  display:flex;
  align-items:center;
  justify-content:center;
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* partículas */
.particles{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
}

.particles span{
  position:absolute;
  width:8px;
  height:8px;
  background:rgba(0,184,160,0.4);
  border-radius:50%;
  animation:float linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);opacity:0}
  50%{opacity:1}
  100%{transform:translateY(-10vh);opacity:0}
}

/* card */
.card{
  position:relative;
  z-index:2;
  width:92%;
  max-width:800px;
  padding:clamp(20px,4vw,50px);
  border-radius:25px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.3);
  box-shadow:0 20px 60px rgba(0,0,0,0.15);
  text-align:center;
  animation:fade 1.2s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

h1{
  color:#00a89c;
  font-size:clamp(1.8rem,4vw,2.6rem);
}

.text{
  color:#056d66;
  font-size:clamp(0.95rem,2.5vw,1.1rem);
  line-height:1.7;
  margin-top:20px;
  min-height:200px;
  white-space:pre-line;
}

.heart{
  font-size:60px;
  margin-top:25px;
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.3)}
  100%{transform:scale(1)}
}

/* responsivo */
@media(max-width:600px){
  .text{
    min-height:260px;
  }
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="card">

  <h1>Bianca 💚</h1>

  <div class="text" id="text"></div>

  <div class="heart">💚</div>

</div>

<script>

// partículas
const container = document.getElementById('particles');

for(let i=0;i<30;i++){
  let s=document.createElement('span');
  s.style.left=Math.random()*100+'vw';
  s.style.animationDuration=(5+Math.random()*10)+'s';
  s.style.width=s.style.height=(5+Math.random()*8)+'px';
  container.appendChild(s);
}

// mensagem
const msg = `Mo… amor…

Eu não sei exatamente como começar isso sem parecer repetitivo,
mas eu preciso ser sincero com você.

Desde que você se afastou, meus dias não são mais os mesmos.
Falta algo… e esse algo é você.

Não é exagero, não é drama… é sentimento.

Você foi muito importante pra mim.
E não existe um botão de desligar isso.

Eu sinto sua falta.
Da gente, das conversas, do jeito leve que tudo era.

Se ainda existir qualquer chance de recomeço,
eu queria tentar de novo… com calma, respeito e maturidade.

Mas independente de qualquer resposta,
você vai sempre ter um lugar importante em mim. 💚`;

let i=0;
function type(){
  if(i<msg.length){
    document.getElementById("text").innerHTML += msg.charAt(i);
    i++;
    setTimeout(type,28);
  }
}

type();

</script>

</body>
</html>
