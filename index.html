<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bom dia 💚</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(-45deg, #a8edea, #d0f7f3, #ffffff);
  background-size:400% 400%;
  animation: bg 10s ease infinite;
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card{
  width:90%;
  max-width:500px;
  padding:35px;
  text-align:center;
  border-radius:20px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.3);
  box-shadow:0 15px 40px rgba(0,0,0,0.1);
  animation:fade 1.2s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  color:#00a89c;
  font-size:2rem;
  margin-bottom:10px;
}

p{
  color:#056d66;
  font-size:1.1rem;
  line-height:1.6;
}

.heart{
  font-size:40px;
  margin-top:15px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

small{
  display:block;
  margin-top:15px;
  color:#0a7d75;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="card">
  <h1>Bom dia 💚</h1>

  <p>
    Bom dia, mo… ☀️<br><br>
    Espero que o seu dia comece leve, calmo e cheio de coisas boas.<br>
    Que você sorria hoje mesmo sem motivo e que nada tire sua paz.<br><br>
    Eu só queria te desejar isso… de coração mesmo.
  </p>

  <div class="heart">💚</div>

  <small>se cuida hoje, tá?</small>
</div>

</body>
</html>
