<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLARA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #05010f, #14052d, #05010f);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    /* Fundo animado */
    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 45vw;
      height: 45vw;
      min-width: 180px;
      min-height: 180px;
      max-width: 420px;
      max-height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(123,97,255,0.28), transparent 70%);
      filter: blur(10px);
      animation: float 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    body::before {
      top: -10vw;
      left: -10vw;
    }

    body::after {
      bottom: -12vw;
      right: -12vw;
      animation-delay: 4s;
    }

    @keyframes float {
      from {
        transform: translateY(0) scale(1);
      }
      to {
        transform: translateY(30px) scale(1.08);
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 920px);
      padding: clamp(28px, 5vw, 56px);
      border-radius: clamp(22px, 4vw, 34px);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      text-align: center;
    }

    h1 {
      font-size: clamp(2.8rem, 15vw, 7rem);
      line-height: 0.95;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: clamp(0.08em, 0.6vw, 0.18em);
      background: linear-gradient(90deg, #ff4d6d, #ffd166, #7b61ff, #00e5ff);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 5s linear infinite;
      margin-bottom: clamp(14px, 3vw, 24px);
      word-break: break-word;
    }

    @keyframes gradient {
      from {
        background-position: 0% center;
      }
      to {
        background-position: 300% center;
      }
    }

    .message {
      font-size: clamp(1.1rem, 5vw, 2.3rem);
      line-height: 1.3;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255,255,255,0.14);
      margin-bottom: clamp(22px, 4vw, 36px);
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      flex: 1 1 240px;
      max-width: 320px;
      border: none;
      border-radius: 999px;
      padding: 15px 22px;
      font-size: clamp(0.95rem, 3vw, 1rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      min-height: 52px;
    }

    .primary {
      background: linear-gradient(135deg, #ff4d6d, #7b61ff);
      color: white;
      box-shadow: 0 12px 28px rgba(123,97,255,0.35);
    }

    .primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 18px 38px rgba(123,97,255,0.5);
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .secondary:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.12);
    }

    /* Celulares pequenos */
    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding: 14px;
      }

      .card {
        width: 100%;
        padding: 26px 18px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
        max-width: none;
      }
    }

    /* Tablets */
    @media (min-width: 481px) and (max-width: 768px) {
      .card {
        padding: 36px 24px;
      }

      button {
        flex: 1 1 calc(50% - 14px);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>CLARA</h1>

    <p class="message">vai se fuder</p>

    <div class="actions">
      <button class="primary" id="explodeBtn">✨ Explodir efeito</button>
      <button class="secondary" id="shakeBtn">⚡ Tremer tela</button>
    </div>
  </main>

  <script>
    const card = document.querySelector('.card');

    document.getElementById('explodeBtn').addEventListener('click', () => {
      card.animate(
        [
          { transform: 'scale(1) rotate(0deg)', filter: 'hue-rotate(0deg)' },
          { transform: 'scale(1.04) rotate(1deg)', filter: 'hue-rotate(45deg)' },
          { transform: 'scale(0.98) rotate(-1deg)', filter: 'hue-rotate(-30deg)' },
          { transform: 'scale(1) rotate(0deg)', filter: 'hue-rotate(0deg)' }
        ],
        { duration: 800, easing: 'ease-in-out' }
      );
    });

    document.getElementById('shakeBtn').addEventListener('click', () => {
      document.body.animate(
        [
          { transform: 'translate(0,0)' },
          { transform: 'translate(-5px,4px)' },
          { transform: 'translate(5px,-4px)' },
          { transform: 'translate(-3px,-2px)' },
          { transform: 'translate(3px,2px)' },
          { transform: 'translate(0,0)' }
        ],
        { duration: 420, iterations: 2 }
      );
    });
  </script>
</body>
</html>
