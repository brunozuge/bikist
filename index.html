<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para a Clara 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa-claro: #ffe3ec;
    --rosa-medio: #ffb6c9;
    --rosa-forte: #ff8fab;
    --pessego: #ffd9c2;
    --lilas: #d9c9ff;
    --texto: #7a4b57;
    --branco: #fffaf9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(160deg, var(--rosa-claro) 0%, var(--pessego) 50%, var(--lilas) 100%);
    background-size: 300% 300%;
    animation: fundoOnda 12s ease infinite;
    color: var(--texto);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }

  @keyframes fundoOnda {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* corações flutuantes de fundo */
  .coracao-flutuante {
    position: fixed;
    top: 100%;
    font-size: 24px;
    pointer-events: none;
    opacity: 0.8;
    user-select: none;
    animation: subir linear forwards;
    z-index: 0;
  }

  @keyframes subir {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  .cartao {
    position: relative;
    z-index: 1;
    background: var(--branco);
    border-radius: 32px;
    padding: 48px 40px 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 143, 171, 0.35), 0 0 0 6px rgba(255, 255, 255, 0.6) inset;
    border: 2px dashed var(--rosa-medio);
    animation: entrada 0.9s cubic-bezier(.2,.9,.3,1.2) both;
  }

  @keyframes entrada {
    0% { opacity: 0; transform: translateY(30px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .selo {
    display: inline-block;
    background: var(--rosa-forte);
    color: white;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 6px 16px;
    border-radius: 999px;
    text-transform: uppercase;
    margin-bottom: 18px;
    box-shadow: 0 4px 10px rgba(255, 143, 171, 0.4);
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-size: 64px;
    line-height: 1;
    margin: 0 0 8px;
    color: var(--rosa-forte);
    text-shadow: 2px 2px 0 rgba(255,255,255,0.7);
  }

  .subtitulo {
    font-size: 17px;
    font-weight: 500;
    color: var(--texto);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .coracao-central {
    font-size: 70px;
    display: inline-block;
    cursor: pointer;
    animation: bater 1.4s ease-in-out infinite;
    transition: transform 0.15s ease;
    filter: drop-shadow(0 8px 18px rgba(255,143,171,0.5));
  }

  .coracao-central:active {
    transform: scale(1.3);
  }

  @keyframes bater {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.15); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
    60% { transform: scale(1); }
  }

  .dica {
    margin-top: 14px;
    font-size: 13px;
    color: var(--rosa-forte);
    opacity: 0.8;
    font-weight: 600;
  }

  .mensagem-extra {
    margin-top: 20px;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--rosa-forte);
    min-height: 34px;
    transition: opacity 0.3s ease;
  }

  .contador {
    margin-top: 8px;
    font-size: 13px;
    color: var(--texto);
    opacity: 0.6;
  }

  @media (max-width: 480px) {
    h1 { font-size: 48px; }
    .cartao { padding: 36px 24px 32px; border-radius: 24px; }
    .coracao-central { font-size: 56px; }
    .subtitulo { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, .coracao-central, .cartao, body, .coracao-flutuante {
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <div class="cartao">
    <span class="selo">recadinho especial</span>
    <h1>eu gosto muito<br>da Clara</h1>
    <p class="subtitulo">é isso mesmo, do fundo do coração 💗<br>toca no coração aí embaixo pra ver</p>

    <div class="coracao-central" id="coracao">💗</div>
    <p class="dica">toque para mais carinho</p>

    <div class="mensagem-extra" id="mensagemExtra"></div>
    <p class="contador" id="contador"></p>
  </div>

<script>
  const mensagens = [
    "você é muito especial 🌸",
    "isso não muda, viu? 💕",
    "olha só quanto carinho 🥹",
    "de verdade, muito mesmo ✨",
    "a Clara merece o mundo 🌷",
    "continua sendo assim, incrível 💗"
  ];

  const coracao = document.getElementById('coracao');
  const mensagemExtra = document.getElementById('mensagemExtra');
  const contadorEl = document.getElementById('contador');
  let cliques = 0;

  coracao.addEventListener('click', () => {
    cliques++;
    const msg = mensagens[Math.floor(Math.random() * mensagens.length)];
    mensagemExtra.style.opacity = 0;
    setTimeout(() => {
      mensagemExtra.textContent = msg;
      mensagemExtra.style.opacity = 1;
    }, 150);

    contadorEl.textContent = cliques === 1
      ? "1 coraçãozinho enviado"
      : cliques + " coraçõezinhos enviados";

    criarCoracaoFlutuante();
  });

  function criarCoracaoFlutuante() {
    const emojis = ['💗','💖','💕','✨','🌸'];
    const el = document.createElement('div');
    el.className = 'coracao-flutuante';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    const duracao = 4 + Math.random() * 3;
    el.style.animationDuration = duracao + 's';
    el.style.fontSize = (18 + Math.random() * 18) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duracao * 1000);
  }

  // uns coraçõezinhos flutuando sozinhos de vez em quando, pra ambientar
  setInterval(criarCoracaoFlutuante, 1800);
  criarCoracaoFlutuante();
</script>

</body>
</html>
